<div class="active-entry">
	<div class="active-entry__left">
		<app-time-entry-description [description]="activeTimeEntry().description ?? ''" (changeDescriptionEvent)=saveTimeEntryDescription($event)/>
		<span class="active-entry__project">{{activeTimeEntry() | displayName}}</span>
	</div>
	<div class="active-entry__right">
		<span class="active-entry__elapsed">{{elapsedTime$ | async}}</span>
		<button class="active-entry__icon active-entry__icon--stop" type="button" (click)="stopTimeEntry()" aria-label="Stop timer"></button>
		<button class="active-entry__icon active-entry__icon--delete" type="button" (click)="deleteTimeEntry()" aria-label="Delete entry"></button>
	</div>
</div>
